<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Test Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --pass-color: #198754;
            --fail-color: #dc3545;
            --skip-color: #ffc107;
            --info-color: #0dcaf0;
            --warning-color: #fd7e14;
        }
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .summary-card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075);
            transition: transform 0.2s;
        }
        .summary-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15);
        }
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
        }
        .stat-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .test-row {
            background: white;
            margin-bottom: 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075);
        }
        .test-header {
            padding: 1rem;
            cursor: pointer;
            border-radius: 0.5rem;
            transition: background-color 0.2s;
        }
        .test-header:hover {
            background-color: #f8f9fa;
        }
        .test-body {
            padding: 1rem;
            border-top: 1px solid #dee2e6;
        }
        .log-entry {
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            border-left: 3px solid;
            background-color: #f8f9fa;
            border-radius: 0.25rem;
        }
        .log-entry.info { border-left-color: var(--info-color); }
        .log-entry.pass { border-left-color: var(--pass-color); }
        .log-entry.fail { border-left-color: var(--fail-color); }
        .log-entry.error { border-left-color: var(--fail-color); }
        .log-entry.warning { border-left-color: var(--warning-color); }
        .log-entry.skip { border-left-color: var(--skip-color); }
        .screenshot-thumb {
            max-width: 200px;
            cursor: pointer;
            border: 2px solid #dee2e6;
            border-radius: 0.25rem;
            margin-top: 0.5rem;
        }
        .screenshot-thumb:hover {
            border-color: var(--info-color);
        }
        .badge-pass { background-color: var(--pass-color); }
        .badge-fail { background-color: var(--fail-color); }
        .badge-skip { background-color: var(--skip-color); }
        @media print {
            .test-body { display: block !important; }
            .header { background: #667eea; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="container">
            <h1 class="display-4"><i class="bi bi-clipboard-data"></i> Custom Test Report</h1>
            <p class="lead">Automated Test Execution Summary</p>
            <p class="mb-0">
                <i class="bi bi-calendar3"></i> Aug 2, 2026, 12:53:46 PM - Aug 2, 2026, 12:53:46 PM
                <span class="ms-3"><i class="bi bi-clock"></i> Duration: 0s</span>
            </p>
        </div>
    </div>

    <!-- Summary Cards -->
    <div class="container mb-4">
        <div class="row g-4">
            <div class="col-md-3">
                <div class="card summary-card text-center">
                    <div class="card-body">
                        <i class="bi bi-list-check fs-1 text-primary"></i>
                        <div class="stat-value text-primary">0</div>
                        <div class="stat-label text-muted">Total Tests</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card summary-card text-center">
                    <div class="card-body">
                        <i class="bi bi-check-circle fs-1" style="color: var(--pass-color);"></i>
                        <div class="stat-value" style="color: var(--pass-color);">0</div>
                        <div class="stat-label text-muted">Passed</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card summary-card text-center">
                    <div class="card-body">
                        <i class="bi bi-x-circle fs-1" style="color: var(--fail-color);"></i>
                        <div class="stat-value" style="color: var(--fail-color);">0</div>
                        <div class="stat-label text-muted">Failed</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card summary-card text-center">
                    <div class="card-body">
                        <i class="bi bi-skip-forward-circle fs-1" style="color: var(--skip-color);"></i>
                        <div class="stat-value" style="color: var(--skip-color);">0</div>
                        <div class="stat-label text-muted">Skipped</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pass Percentage -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Pass Rate</h5>
                        <div class="progress" style="height: 30px;">
                            <div class="progress-bar bg-success" role="progressbar"
                                 style="width: 0%;"
                                 aria-valuenow="0"
                                 aria-valuemin="0"
                                 aria-valuemax="100">
                                0%
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Test Details -->
    <div class="container mb-5">
        <h2 class="mb-4"><i class="bi bi-file-earmark-text"></i> Test Details</h2>
        <div class="alert alert-info">No tests executed</div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">Generated on Aug 2, 2026, 12:53:46 PM | Playwright Custom Reporter</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle test details
        function toggleTest(testId) {
            const body = document.getElementById('test-body-' + testId);
            const icon = document.getElementById('icon-' + testId);
            if (body.style.display === 'none' || body.style.display === '') {
                body.style.display = 'block';
                icon.classList.remove('bi-chevron-down');
                icon.classList.add('bi-chevron-up');
            } else {
                body.style.display = 'none';
                icon.classList.remove('bi-chevron-up');
                icon.classList.add('bi-chevron-down');
            }
        }

        // Expand screenshot
        function expandScreenshot(imgSrc) {
            const modal = document.createElement('div');
            modal.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; align-items: center; justify-content: center;';
            modal.onclick = () => modal.remove();

            const img = document.createElement('img');
            img.src = imgSrc;
            img.style.cssText = 'max-width: 90%; max-height: 90%; border: 2px solid white;';

            modal.appendChild(img);
            document.body.appendChild(modal);
        }
    </script>
</body>
</html>
